name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # P0 门禁真话化（圆桌决策 A · 2026-09-19）：作业级硬顶兜底——真挂死也快速失败，不再挂满平台 6h 上限被 cancelled
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax check
        run: |
          node --check plugin-host.js
          node --check lib/index.cjs
          node --check lib/sys.cjs
          node --check lib/updater-host.cjs

      # P2（2026-09-19）：RPC 契约事实源一致性——由注册面派生，锁「文档面 / schema 覆盖 / 具名申报 / 孤儿」四不变量
      # P4（2026-09-19）贯穿判据：门禁**存在 ≠ 被执行**——四个结构门禁收敛为 `npm run gate` 一条命令，并首次进入 CI。
      #   串行链：死代码/装配 R1–R4 → RPC 契约 → 提示词生成区漂移 → ADR 承诺 ↔ 代码现状（arch-claims）
      #   `if: always()` 必加：run 35397066749 实证——本步失败会把其后的「Run tests」整步 skipped，
      #   等于用一条门禁吃掉另一条判据的读数（正是 P0 修掉的静默面）。判据之间不得互相遮蔽。
      - name: Structure gates (dead-code · RPC · prompts · arch-claims)
        if: always()
        run: npm run gate

      # P0 门禁真话化（圆桌决策 A · 2026-09-19）：历史问题是「测试跑完但进程不退出」——
      # node --test 会等事件循环清空，Linux 上被某个测试文件的长驻句柄吊住 → 作业挂满平台 6h 硬顶
      # 被 cancelled → 其后两步永远 skipped，验证面因此长期拿不到任何信号（近 12 次运行 success = 0）。
      #
      # 2026-09-19 第一次修复（--test-force-exit + --test-timeout）实测**不足**：run 35391559294 仍在
      # 12 分钟步级硬顶处被杀，且结束时残留 4 个 node 孤儿进程 → 挂起发生在测试**进程内**，
      # 不是「跑完不退出」，force-exit 帮不上；test-timeout 也打断不了阻塞中的用例。
      # 故改为**按文件隔离跑**：每个测试文件独立进程 + 60s 硬顶，挂死只影响它自己，
      # 其余文件照常给结论（这同时就是「12 件零上报文件」的逐件裁定手段）。
      # P4 尾修（2026-09-19）：硬顶 40→60s（bundle-smoke 有 ~30s 退出尾巴），并新增「源码注册数 ≥ runner 上报数」
      # 不变量——把「用例静默消失而 CI 报绿」这一类假绿变成红色失败（详见下方 run 步骤内注释）。
      - name: Run tests (per-file isolation · 60s cap each · 注册数不变量)
        if: always()
        timeout-minutes: 12
        run: |
          set -uo pipefail
          mkdir -p test-reports
          files=$(node -p "require('./package.json').scripts.test.replace('node --test ','')")
          rc=0
          for f in $files; do
            n=$(basename "$f" .test.cjs)
            t0=$(date +%s)
            if timeout -s KILL 60 node --test "$f" >"test-reports/$n.log" 2>&1; then
              # P4 尾修（2026-09-19·CI 实测驱动）：此处**不得**再加 --test-force-exit。
              # run 35400375036 的探针实证：test/lib.test.cjs 在 ubuntu 上「已读到文件尾且注册 82 个顶层 test」，
              # 但挂该旗标时 runner 只上报 52/53 条（两次运行数值还不一样）⇒ 29 条用例随子进程提前退出而静默消失，
              # 而 CI 仍报 success。去掉旗标后本地实测 16 文件全部自行退出且 exit 0（合计 257）⇒ 改为不加旗标。
              # 硬顶 40→60s：bundle-smoke 有 ~30s 退出尾巴（本地实测 30,398ms），需留头寸；真挂死仍会被硬顶杀掉。
              decl=$(grep -c '^test(' "$f" || true)
              rep=$(sed -n 's/^# tests \([0-9]*\)$/\1/p' "test-reports/$n.log" | tail -1)
              rep=${rep:-0}
              if [ "$rep" -lt "$decl" ]; then
                printf 'FAIL  %-24s %3ss  静默少报：源码注册 %s / runner 上报 %s\n' "$n" "$(( $(date +%s) - t0 ))" "$decl" "$rep"
                rc=1
              else
                printf 'PASS  %-24s %3ss  ok=%s (注册 %s / 上报 %s)\n' "$n" "$(( $(date +%s) - t0 ))" "$(grep -c '^ok ' "test-reports/$n.log" || true)" "$decl" "$rep"
              fi
            else
              c=$?
              printf 'FAIL  %-24s %3ss  exit=%s\n' "$n" "$(( $(date +%s) - t0 ))" "$c"
              rc=1
            fi
          done
          echo '==== 汇总：每文件 tests/pass/fail + 失败用例名 ===='
          grep -h -E '^# (tests|pass|fail)|^not ok [0-9]+ - ' test-reports/*.log || true
          for l in test-reports/*.log; do echo "===== $l ====="; cat "$l"; done > test-report.txt
          exit $rc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
          if-no-files-found: warn

      # 后置两步改 if: always()：测试失败也要把「产物是否与源码一致」这条独立判据取回来。
      # 原实现的 skipped 是静默面——一次挂起会把两条判据一起吞掉。
      - name: Build client bundle
        if: always()
        run: npm run build

      - name: Verify generated artifacts are committed
        if: always()
        run: git diff --exit-code -- lib/client.cjs plugin-host.js
