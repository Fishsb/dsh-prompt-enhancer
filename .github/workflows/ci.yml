name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # P0 门禁真话化（圆桌决策 A · 2026-09-19）：作业级硬顶兜底——真挂死也快速失败，不再挂满平台 6h 上限被 cancelled
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax check
        run: |
          node --check plugin-host.js
          node --check lib/index.cjs
          node --check lib/sys.cjs
          node --check lib/updater-host.cjs

      # P2（2026-09-19）：RPC 契约事实源一致性——由注册面派生，锁「文档面 / schema 覆盖 / 具名申报 / 孤儿」四不变量
      - name: RPC contract check
        run: node scripts/rpc-manifest.mjs --check

      # P0 门禁真话化（圆桌决策 A · 2026-09-19）：历史问题是「测试跑完但进程不退出」——
      # node --test 会等事件循环清空，Linux 上被某个测试文件的长驻句柄吊住 → 作业挂满平台 6h 硬顶
      # 被 cancelled → 其后两步永远 skipped，验证面因此长期拿不到任何信号（近 12 次运行 success = 0）。
      #
      # 2026-09-19 第一次修复（--test-force-exit + --test-timeout）实测**不足**：run 35391559294 仍在
      # 12 分钟步级硬顶处被杀，且结束时残留 4 个 node 孤儿进程 → 挂起发生在测试**进程内**，
      # 不是「跑完不退出」，force-exit 帮不上；test-timeout 也打断不了阻塞中的用例。
      # 故改为**按文件隔离跑**：每个测试文件独立进程 + 40s 硬顶，挂死只影响它自己，
      # 其余文件照常给结论（这同时就是「12 件零上报文件」的逐件裁定手段）。
      - name: Run tests (per-file isolation · 40s cap each)
        timeout-minutes: 12
        run: |
          set -uo pipefail
          mkdir -p test-reports
          files=$(node -p "require('./package.json').scripts.test.replace('node --test ','')")
          rc=0
          for f in $files; do
            n=$(basename "$f" .test.cjs)
            t0=$(date +%s)
            if timeout -s KILL 40 node --test --test-force-exit "$f" >"test-reports/$n.log" 2>&1; then
              printf 'PASS  %-24s %3ss  ok=%s\n' "$n" "$(( $(date +%s) - t0 ))" "$(grep -c '^ok ' "test-reports/$n.log" || true)"
            else
              c=$?
              printf 'FAIL  %-24s %3ss  exit=%s\n' "$n" "$(( $(date +%s) - t0 ))" "$c"
              rc=1
            fi
          done
          echo '==== 汇总：每文件 tests/pass/fail + 失败用例名 ===='
          grep -h -E '^# (tests|pass|fail)|^not ok [0-9]+ - ' test-reports/*.log || true
          for l in test-reports/*.log; do echo "===== $l ====="; cat "$l"; done > test-report.txt
          exit $rc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
          if-no-files-found: warn

      # 后置两步改 if: always()：测试失败也要把「产物是否与源码一致」这条独立判据取回来。
      # 原实现的 skipped 是静默面——一次挂起会把两条判据一起吞掉。
      - name: Build client bundle
        if: always()
        run: npm run build

      - name: Verify generated artifacts are committed
        if: always()
        run: git diff --exit-code -- lib/client.cjs plugin-host.js
